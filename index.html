<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Carango TV — Browse & Search</title>
<style>
  :root{ --bg:#181818; --panel:#141414; --fg:#fff; --muted:#bdbdbd; --accent:#e50914; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,Segoe UI,Roboto,Arial,sans-serif}

  /* Header */
  header {
    display: grid;
    grid-template-columns: auto minmax(300px, 1fr) auto;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 3000;
    background: var(--panel);
    padding: 10px 16px;
  }

  .brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.2px}
  .brand svg{width:26px;height:26px;color:var(--accent)}
  .controls{display:flex;gap:10px;flex-wrap:wrap; justify-content:flex-end}
  .chip, select, .btn{
    background:#2a2a2a; color:#fff; border:0; border-radius:999px; padding:10px 14px; cursor:pointer; font-weight:600;
  }
  .chip.active{background:var(--accent)}
  .btn.primary{background:var(--accent)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  body.modal-open{overflow:hidden}

  /* Search */
  .search-wrap { position: relative; display: flex; align-items: center; justify-content: left; }
  #searchBox{
    width:100%; max-width:560px; background:#2a2a2a; color:#fff; border:1px solid #333;
    border-radius:999px; padding:10px 14px; outline:none;
  }
  #searchBox::placeholder{color:#9a9a9a}
  .sugg {
    position: absolute; left: 0; top: calc(100% + 6px); width: 100%; max-width: 560px;
    background: #0f0f0f; border: 1px solid #222; border-radius: 12px; overflow-y: auto;
    max-height: 700px; box-shadow: 0 12px 30px rgba(0,0,0,.45); display: none; z-index: 9999;
  }
  .sugg::-webkit-scrollbar { width: 8px; }
  .sugg::-webkit-scrollbar-thumb { background: #444; border-radius: 6px; }
  .sugg-item{display:flex; gap:10px; align-items:center; padding:8px 10px; cursor:pointer; border-bottom:1px solid #1f1f1f;}
  .sugg-item:last-child{border-bottom:0}
  .sugg-item img{width:40px; height:60px; object-fit:cover; border-radius:6px}
  .sugg-item .t{display:flex; flex-direction:column}
  .sugg-item .name{font-size:14px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:380px;}
  .sugg-item .meta{font-size:12px; color:#bdbdbd}
  .sugg-item.active{background:#1a1a1a}
  .sugg-section{padding:7px 10px 5px;color:#8f8f8f;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .sugg-item .person-photo{border-radius:50%;height:46px;width:46px}

  main{padding:22px}
  h2{margin:0 0 12px 4px; font-size:22px}
  .status{margin:10px 6px; color:var(--muted)}

  /* Filters bar */
  .filters{
    display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    background:#111; border:1px solid #222; border-radius:12px; padding:10px 12px; margin:10px 4px 16px;
  }
  .filters label{font-size:13px; color:#cfcfcf; margin-right:6px}
  .filters .group{display:flex; align-items:center; gap:8px}
  .filters select,.filters input{min-width:140px}
  #countrySelect{width:180px;max-width:180px}
  .filters input{
    background:#2a2a2a;color:#fff;border:0;border-radius:999px;padding:10px 14px;
    outline:none;font:inherit;font-weight:600;
  }
  .filters input::placeholder{color:#ddd}
  .filter-actions{display:flex;gap:8px;align-items:center}

  /* Vertical layout only */
  .row.vertical { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 6px 4px 12px; }
  .card { background:#0f0f0f; color:inherit; font:inherit; text-align:left; padding:0; border-radius:10px; overflow:hidden; cursor:pointer; transition:transform .2s ease, box-shadow .2s ease; border:1px solid #222; }
  .card:hover{transform:translateY(-2px); box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .card img{width:100%; aspect-ratio:2/3; object-fit:cover;}
  .card:focus{ outline:2px solid var(--accent); outline-offset:-2px }
  .card .meta{padding:10px}
  .card .title{font-weight:750;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .sub{font-size:13px;color:var(--muted);margin-top:5px}
  .library-heading{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 8px}
  .library-heading h2{margin:0}
  #libraryExtras{display:none}

  /* Modal */
  .modal{position:fixed; inset:0; display:none; place-items:center; background:rgba(0,0,0,.72); z-index:5000;padding:16px}
  .modal.open{display:grid}
  .sheet{max-width:880px; max-height:calc(100vh - 32px); width:min(92vw,880px); background:#111; border:1px solid #222; border-radius:16px; overflow:auto}
  .sheet-wrap{display:grid; grid-template-columns:280px 1fr; gap:16px; padding:16px}
  .sheet img{width:100%; border-radius:10px}
  .sheet h3{margin:0 0 6px}
  .sheet .overview{color:#d0d0d0; font-size:14px}
  .btn.secondary{background:#2a2a2a}
  .sheet-actions{display:flex; gap:10px; margin-top:12px}

  /* #LABEL: ModalControlsStyles */
  .season-episode{display:none; gap:.75rem; align-items:center; flex-wrap:wrap; margin-top:10px}
  .season-episode label{font-weight:600; opacity:.9}
  .season-episode select{background:#141414; color:#fff; border:1px solid #333; border-radius:8px; padding:.5rem .6rem}
  .season-episode select:disabled{opacity:.6}

  @media (max-width:720px){
    header{grid-template-columns:1fr; gap:10px}
    .controls {flex-wrap: wrap; align-items: center; justify-content: flex-start;}
    .filters .group{width:100%}
    .filters select,.filters input{flex:1;min-width:0}
    #countrySelect{width:auto;max-width:none}
    .sheet-wrap{grid-template-columns:1fr}
  }

  /* #LABEL: TrailerStyles */
  .trailer{ margin-top:10px; border:1px solid #222; border-radius:10px; overflow:hidden;
    background:#000; position:relative; aspect-ratio:16/9; display:none; }
  .trailer img{ width:100%; height:100%; object-fit:cover; display:block; }
  .trailer button.play{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(to bottom, rgba(0,0,0,.05), rgba(0,0,0,.45)); border:0; cursor:pointer; }
  .trailer button.play::before{ content:"▶"; font-size:48px; line-height:1; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.6); }
  .trailer .badge{ position:absolute; top:8px; left:8px; background:#e50914; color:#fff; font-size:12px;
    padding:4px 8px; border-radius:999px; }
  .trailer iframe{ width:100%; height:100%; border:0; display:block; }

  /* #LABEL: PlayerOverlayStyles */
  .player-overlay{position:fixed; inset:0; background:#000; display:none; z-index:9999;}
  .player-overlay.open{display:block;}

  /* iframe fills the entire overlay — always gets clicks by default */
  .player-frame{position:absolute; inset:0; width:100%; height:100%; border:0; z-index:1;}

  /* control bar floats on top — only the bar strip itself blocks clicks, nothing else */
  .player-bar{
    position:absolute; top:0; left:0; right:0; z-index:2;
    display:flex; gap:10px; align-items:center;
    padding:8px 16px;
    background:linear-gradient(to bottom, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0) 100%);
    color:#fff;
    opacity:0;
    transition: opacity 0.3s ease;
    /* bar itself never blocks pointer events — only the buttons inside do */
    pointer-events:none;
  }
  /* show bar only when controls-visible class is active (JS-controlled) */
  .player-overlay.controls-visible .player-bar {
    opacity:1;
  }
  /* only the interactive elements inside the bar capture clicks */
  .player-bar button,
  .player-bar .badge-lite {
    pointer-events:auto;
    cursor:pointer;
  }
  .player-bar .spacer{ flex:1; pointer-events:none; }
  .badge-lite{background:rgba(0,0,0,0.5); padding:4px 8px; border-radius:999px; font-size:12px}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span><h2 style="color: #FF0000; padding-top: 10px;">Carango Tv</h2></span>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <input id="searchBox" type="text" placeholder="Search movies, TV shows & actors…" autocomplete="off"
      aria-label="Search movies, TV shows, and actors" aria-expanded="false" aria-controls="suggList" />
    <div id="suggList" class="sugg" role="listbox" aria-label="Search suggestions"></div>
  </div>

  <div class="controls">
    <button class="chip active" id="tabMovie" onclick="switchType('movie')">Movies</button>
    <button class="chip" id="tabTV" onclick="switchType('tv')">TV Shows</button>
    <button class="chip" id="tabMyList" onclick="showMyList()">My List</button>
    <select id="timeSelect" onchange="reloadTrending()">
      <option value="day">Today</option>
      <option value="week">This Week</option>
    </select>
  </div>
</header>

<main>
  <h2 id="sectionTitle">Trending Movies</h2>

  <!-- Filters -->
  <div class="filters">
    <div class="group">
      <label for="genreSelect">Genre</label>
      <select id="genreSelect"><option value="">All Genres</option></select>
    </div>
    <div class="group">
      <label for="countrySelect">Country</label>
      <select id="countrySelect"><option value="">All Countries</option></select>
    </div>
    <div class="group">
      <label for="languageSelect">Language</label>
      <select id="languageSelect"><option value="">All Languages</option></select>
    </div>
    <div class="group">
      <label for="originInput" id="originLabel">Studio</label>
      <input id="originInput" list="originOptions" placeholder="All Studios" autocomplete="off" />
      <datalist id="originOptions"></datalist>
    </div>
    <div class="group">
      <label for="decadeSelect">Decade</label>
      <select id="decadeSelect">
        <option value="">Any Decade</option>
        <option value="2020">2020s</option>
        <option value="2010">2010s</option>
        <option value="2000">2000s</option>
        <option value="1990">1990s</option>
        <option value="1980">1980s</option>
        <option value="1970">1970s</option>
        <option value="1960">1960s</option>
        <option value="1950">1950s</option>
        <option value="older">Before 1950</option>
      </select>
    </div>
    <div class="group">
      <label for="ratingSelect">Rating</label>
      <select id="ratingSelect">
        <option value="">Any Rating</option>
        <option value="6">6+</option>
        <option value="7">7+</option>
        <option value="8">8+</option>
      </select>
    </div>
    <div class="group">
      <label for="sortSelect">Sort</label>
      <select id="sortSelect">
        <option value="popular">Popular</option>
        <option value="date_desc">Newest → Oldest</option>
        <option value="date_asc">Oldest → Newest</option>
        <option value="rating_desc">Top Rated</option>
      </select>
    </div>
    <div class="filter-actions">
      <button class="btn primary" onclick="applyFilters()">Apply</button>
      <button class="btn secondary" onclick="resetFilters()">Reset</button>
    </div>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>
  <div id="contentRow" class="row vertical"></div>
  <section id="libraryExtras" aria-label="Recently viewed">
    <div class="library-heading">
      <h2>Recently Viewed</h2>
      <button class="btn secondary" onclick="clearRecent()">Clear History</button>
    </div>
    <div id="recentRow" class="row vertical"></div>
  </section>
</main>

<!-- Detail Modal -->
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet" tabindex="-1">
    <div class="sheet-wrap">
      <img id="mPoster" alt="Poster">
      <div>
        <h3 id="mTitle"></h3>
        <div class="sub" id="mMeta"></div>
        <div id="trailerWrap" class="trailer" aria-label="Trailer preview"></div>
        <p class="overview" id="mOverview"></p>

        <!-- #LABEL: ModalControls (TV-only S/E controls) -->
        <div class="season-episode" id="tvControls">
          <label for="seasonSelect">Season:</label>
          <select id="seasonSelect" disabled>
            <option value="">Loading…</option>
          </select>

          <label for="episodeSelect">Episode:</label>
          <select id="episodeSelect" disabled>
            <option value="">Select a season first</option>
          </select>
        </div>

        <div class="sheet-actions">
          <button class="btn primary" id="playBtn">▶ Play</button>
          <button class="btn secondary" id="myListBtn">+ My List</button>
          <button class="btn secondary" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- #LABEL: PlayerOverlay -->
<div id="playerOverlay" class="player-overlay" aria-label="Episode Player">
  <div class="player-bar">
    <strong id="playerTitle">Playing</strong>
    <span class="badge-lite" id="playerBadge"></span>
    <span class="spacer"></span>
    <button id="prevEpBtn">⟨ Prev</button>
    <button id="nextEpBtn">Next ⟩</button>
    <button id="closePlayerBtn" class="btn secondary" style="margin-left:8px;">Exit</button>
  </div>
  <iframe id="playerFrame" class="player-frame" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
</div>

let currentPage = 1;
let totalPages = 1;
let isLoadingMore = false;
let currentType = "movie";
let lastFetchMode = "trending";
let activeIndex = -1;
let searchDebounceId = null;
let originDebounceId = null;
let searchAbort = null;
let searchSequence = 0;
let suggestionItems = [];

let modalSequence = 0;
let lastFocusedElement = null;
let collectionSequence = 0;
const companyCache = new Map();
const rowSeen = { contentRow:new Set(), recentRow:new Set() };

let appData = loadAppData();

function byId(id){ return document.getElementById(id); }
function normalized(value){ return String(value || "").trim().toLowerCase(); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function mediaTypeFor(item, fallback){
  return (item.media_type === "movie" || item.media_type === "tv") ? item.media_type : fallback;
}
function mediaTitle(item){ return item.title || item.name || "Untitled"; }
function mediaDate(item, type){
  return type === "tv" ? (item.first_air_date || "") : (item.release_date || "");
}
function isReleased(item, type){
  const date = mediaDate(item, type);
  return Boolean(date && date <= todayISO());
}

async function apiFetch(path, params={}, options={}){
  const query = new URLSearchParams({ ...params, api_key:TMDB_API_KEY });
  const response = await fetch(`https://api.themoviedb.org/3${path}?${query}`, {
    signal:options.signal
  });
  if(!response.ok) throw new Error(`${response.status} ${response.statusText}`);
  return response.json();
}

function loadAppData(){
  const fallback = { myList:[], recent:[], progress:{}, filters:{ movie:{}, tv:{} } };
  try{
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(!parsed || typeof parsed !== "object") return fallback;
    return {
      myList:Array.isArray(parsed.myList) ? parsed.myList : [],
      recent:Array.isArray(parsed.recent) ? parsed.recent : [],
      progress:parsed.progress && typeof parsed.progress === "object" ? parsed.progress : {},
      filters:{
        movie:parsed.filters?.movie || {},
        tv:parsed.filters?.tv || {}
      }
    };
  }catch(error){
    console.warn("Could not load saved Carango data", error);
    return fallback;
  }
}

function saveAppData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
  }catch(error){
    console.warn("Could not save Carango data", error);
    setStatus("Your browser could not save local changes.");
  }
}

function compactItem(item, type){
  return {
    id:item.id,
    media_type:type,
    title:item.title || "",
    name:item.name || "",
    poster_path:item.poster_path || "",
    backdrop_path:item.backdrop_path || "",
    overview:item.overview || "",
    release_date:item.release_date || "",
    first_air_date:item.first_air_date || "",
    vote_average:Number(item.vote_average || 0)
  };
}

function itemKey(item, type){ return `${type}:${item.id}`; }
function progressKey(tvId){ return `tv:${tvId}`; }

function addRecent(item, type){
  const key = itemKey(item, type);
  const saved = compactItem(item, type);
  appData.recent = [saved, ...appData.recent.filter(entry =>
    itemKey(entry, entry.media_type) !== key
  )].slice(0,20);
  saveAppData();
  if(lastFetchMode === "library") renderRecent();
}

function isInMyList(item, type){
  const key = itemKey(item, type);
  return appData.myList.some(entry => itemKey(entry, entry.media_type) === key);
}

function updateMyListButton(){
  if(!modalContext) return;
  byId("myListBtn").textContent = isInMyList(modalContext.item, modalContext.type)
    ? "✓ In My List"
    : "+ My List";
}

function toggleMyList(){
  if(!modalContext) return;
  const { item, type } = modalContext;
  const key = itemKey(item, type);
  if(isInMyList(item, type)){
    appData.myList = appData.myList.filter(entry => itemKey(entry, entry.media_type) !== key);
  }else{
    appData.myList.unshift(compactItem(item, type));
  }
  saveAppData();
  updateMyListButton();
  if(lastFetchMode === "library") showMyList();
}

function clearRecent(){
  if(!appData.recent.length) return;
  if(!window.confirm("Clear all recently viewed titles?")) return;
  appData.recent = [];
  saveAppData();
  renderRecent();
}

function saveProgress(item, season, episode){
  appData.progress[progressKey(item.id)] = {
    season:Number(season),
    episode:Number(episode),
    title:mediaTitle(item),
    poster_path:item.poster_path || "",
    updatedAt:Date.now()
  };
  saveAppData();
}

function savedProgress(tvId){
  return appData.progress[progressKey(tvId)] || null;
}

document.addEventListener("DOMContentLoaded", async ()=>{
  setStatus("Loading…");
  wireSearch();
  wireOriginSearch();
  wireModalAndKeyboard();
  byId("myListBtn").addEventListener("click", toggleMyList);

  await Promise.allSettled([
    loadConfiguration(),
    loadGenres(currentType)
  ]);
  populateOriginOptions();
  restoreFilters();
  reloadTrending();

  window.addEventListener("scroll", handleInfiniteScroll, { passive:true });
});

async function handleInfiniteScroll(){
  if(!["trending","discover"].includes(lastFetchMode)) return;
  const threshold = 400;
  if(window.innerHeight + window.scrollY < document.body.offsetHeight - threshold) return;
  if(isLoadingMore || currentPage >= totalPages) return;
  isLoadingMore = true;
  const nextPage = currentPage + 1;
  try{
    if(lastFetchMode === "discover"){
      await discoverFetch(nextPage, true);
    }else{
      await loadTrending(currentType, byId("timeSelect").value, nextPage, true);
    }
  }finally{
    isLoadingMore = false;
  }
}

async function searchCompanies(query){
  const key = normalized(query);
  if(companyCache.has(key)) return companyCache.get(key);
  const data = await apiFetch("/search/company", { query, page:1 });
  const results = (data.results || []).slice(0,8);
  companyCache.set(key, results);
  return results;
}

async function resolveStudioIds(value){
  if(!value) return [];
  const group = MOVIE_STUDIOS.find(studio => normalized(studio.label) === normalized(value));
  const queries = group ? group.queries : [value];
  const ids = new Set();
  const resultSets = await Promise.all(queries.map(query => searchCompanies(query).catch(()=>[])));
  resultSets.forEach((results,index)=>{
    const queryName = normalized(queries[index]);
    const exact = results.find(company => normalized(company.name) === queryName);
    if(exact) ids.add(exact.id);
    else if(results[0]) ids.add(results[0].id);
  });
  return [...ids];
}

async function resolveOriginalFilter(type, value){
  if(!value) return {};
  if(type === "tv"){
    const network = TV_NETWORKS.find(entry => normalized(entry.label) === normalized(value));
    if(network) return { with_networks:String(network.id) };
  }
  const ids = await resolveStudioIds(value);
  return ids.length ? { with_companies:ids.join("|") } : null;
}

function buildDecadeParams(type, decade){
  if(!decade) return {};
  const prefix = type === "movie" ? "primary_release_date" : "first_air_date";
  if(decade === "older") return { [`${prefix}.lte`]:"1949-12-31" };
  const start = Number(decade);
  const end = Math.min(start + 9, new Date().getFullYear());
  return {
    [`${prefix}.gte`]:`${start}-01-01`,
    [`${prefix}.lte`]:end === new Date().getFullYear() ? todayISO() : `${end}-12-31`
  };
}

async function discoverFetch(page=1, append=false){
  const type = currentType;
  const filters = currentFilterValues();
  const requestId = collectionSequence;
  if(!append) setStatus("Loading…");
  try{
    const originalParams = await resolveOriginalFilter(type, filters.origin);
    if(originalParams === null){
      if(!append) setStatus(`${type === "movie" ? "Studio" : "Network"} not found. Try another name.`);
      return;
    }

    const sortMap = {
      popular:"popularity.desc",
      date_desc:type === "movie" ? "primary_release_date.desc" : "first_air_date.desc",
      date_asc:type === "movie" ? "primary_release_date.asc" : "first_air_date.asc",
      rating_desc:"vote_average.desc"
    };
    const datePrefix = type === "movie" ? "primary_release_date" : "first_air_date";
    const params = {
      language:"en-US",
      page,
      include_adult:"false",
      sort_by:sortMap[filters.sort] || "popularity.desc",
      [`${datePrefix}.lte`]:todayISO(),
      ...buildDecadeParams(type, filters.decade),
      ...originalParams
    };
    if(filters.genre) params.with_genres = filters.genre;
    if(filters.country) params.with_origin_country = filters.country;
    if(filters.language) params.with_original_language = filters.language;
    if(filters.rating) params["vote_average.gte"] = filters.rating;
    if(filters.sort === "rating_desc") params["vote_count.gte"] = "200";

    const data = await apiFetch(`/discover/${type}`, params);
    if(requestId !== collectionSequence || type !== currentType) return;
    totalPages = Math.min(Number(data.total_pages || 1), 500);
    currentPage = page;
    const items = (data.results || []).filter(item => isReleased(item, type));
    if(append){
      appendRow(items, type);
      if(currentPage >= totalPages) setStatus("End of results.");
    }else{
      renderRow(items, type);
      setStatus(items.length ? "" : "No titles match these filters. Try removing one filter.");
    }
  }catch(error){
    console.error(error);
    if(!append) setStatus("Could not fetch Browse results. Try again.");
  }
}

function setStatus(message){ byId("status").textContent = message || ""; }

function renderRow(items, type, rowId="contentRow"){
  const row = byId(rowId);
  row.innerHTML = "";
  rowSeen[rowId] = new Set();
  appendRow(items, type, rowId);
}

function appendRow(items, type, rowId="contentRow"){
  const row = byId(rowId);
  const seen = rowSeen[rowId] || (rowSeen[rowId] = new Set());
  for(const item of items){
    const itemType = mediaTypeFor(item, type);
    if(itemType !== "movie" && itemType !== "tv") continue;
    const key = itemKey(item, itemType);
    if(seen.has(key)) continue;
    seen.add(key);

    const card = document.createElement("button");
    card.type = "button";
    card.className = "card";
    card.setAttribute("aria-label", `Open ${mediaTitle(item)}`);

    const image = document.createElement("img");
    image.src = item.poster_path ? IMG + item.poster_path : PLACEHOLDER_POSTER;
    image.loading = "lazy";
    image.alt = `${mediaTitle(item)} poster`;
    image.onerror = ()=>{ image.onerror = null; image.src = PLACEHOLDER_POSTER; };

    const meta = document.createElement("div");
    meta.className = "meta";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = mediaTitle(item);
    const sub = document.createElement("div");
    sub.className = "sub";
    const rating = Number(item.vote_average || 0).toFixed(1);
    const progress = itemType === "tv" ? savedProgress(item.id) : null;
    sub.textContent = progress
      ? `TV • Continue S${String(progress.season).padStart(2,"0")} E${String(progress.episode).padStart(2,"0")} • ⭐ ${rating}`
      : `${itemType === "tv" ? "TV" : "MOVIE"} • ⭐ ${rating}`;

    meta.append(title, sub);
    card.append(image, meta);
    card.addEventListener("click", ()=>openModal(item, itemType));
    row.appendChild(card);
  }
}

/*** SEARCH + ACTOR CREDITS ***/
function wireSearch(){
  const box = byId("searchBox");
  const list = byId("suggList");
  box.addEventListener("input", ()=>{
    clearTimeout(searchDebounceId);
    const query = box.value.trim();
    activeIndex = -1;
    if(!query){
      closeSuggestions();
      return;
    }
    searchDebounceId = setTimeout(()=>performSearch(query),280);
  });

  box.addEventListener("keydown", event=>{
    if(!suggestionItems.length) return;
    if(event.key === "ArrowDown"){
      event.preventDefault();
      setSuggestionActive((activeIndex + 1) % suggestionItems.length);
    }else if(event.key === "ArrowUp"){
      event.preventDefault();
      setSuggestionActive((activeIndex - 1 + suggestionItems.length) % suggestionItems.length);
    }else if(event.key === "Enter" && activeIndex >= 0){
      event.preventDefault();
      chooseSuggestion(suggestionItems[activeIndex]);
    }else if(event.key === "Escape"){
      closeSuggestions();
    }
  });

  document.addEventListener("click", event=>{
    if(!list.contains(event.target) && event.target !== box) closeSuggestions();
  });
}

async function performSearch(query){
  const sequence = ++searchSequence;
  if(searchAbort) searchAbort.abort();
  searchAbort = new AbortController();
  try{
    const data = await apiFetch("/search/multi", {
      language:"en-US",
      query,
      page:1,
      include_adult:"false"
    }, { signal:searchAbort.signal });
    if(sequence !== searchSequence) return;
    const q = normalized(query);
    const results = (data.results || [])
      .filter(item => ["movie","tv","person"].includes(item.media_type))
      .filter(item => item.media_type !== "person" || item.known_for_department === "Acting")
      .map(item => ({ item, score:searchScore(item,q) }))
      .sort((a,b)=>b.score-a.score)
      .slice(0,10)
      .map(entry=>entry.item);
    renderSuggestions(results);
  }catch(error){
    if(error.name !== "AbortError"){
      console.error("Search failed", error);
      closeSuggestions();
    }
  }
}

function searchScore(item, query){
  const name = normalized(item.title || item.name);
  let score = Number(item.popularity || 0);
  if(name === query) score += 10000;
  else if(name.startsWith(query)) score += 5000;
  else if(name.includes(query)) score += 2000;
  if(item.media_type === "person" && name === query) score += 1000;
  return score;
}

function renderSuggestions(results){
  const list = byId("suggList");
  list.innerHTML = "";
  suggestionItems = results;
  activeIndex = -1;
  for(const item of results){
    const option = document.createElement("div");
    option.className = "sugg-item";
    option.setAttribute("role","option");
    option.setAttribute("aria-selected","false");

    const image = document.createElement("img");
    const isPerson = item.media_type === "person";
    image.className = isPerson ? "person-photo" : "";
    image.src = isPerson
      ? (item.profile_path ? IMG92 + item.profile_path : PLACEHOLDER_THUMB)
      : (item.poster_path ? IMG92 + item.poster_path : PLACEHOLDER_THUMB);
    image.alt = "";

    const text = document.createElement("div");
    text.className = "t";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = item.title || item.name || "Untitled";
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = isPerson
      ? `ACTOR • ${item.known_for_department || "Person"}`
      : `${item.media_type.toUpperCase()} • ${item.release_date || item.first_air_date || ""}`;
    text.append(name,meta);
    option.append(image,text);
    option.addEventListener("click",()=>chooseSuggestion(item));
    list.appendChild(option);
  }
  list.style.display = results.length ? "block" : "none";
  byId("searchBox").setAttribute("aria-expanded", results.length ? "true" : "false");
}

function setSuggestionActive(index){
  const options = [...byId("suggList").querySelectorAll(".sugg-item")];
  options.forEach((option,i)=>{
    const active = i === index;
    option.classList.toggle("active",active);
    option.setAttribute("aria-selected",String(active));
    if(active) option.scrollIntoView({ block:"nearest" });
  });
  activeIndex = index;
}

function chooseSuggestion(item){
  closeSuggestions();
  byId("searchBox").value = "";
  if(item.media_type === "person") showActorCredits(item);
  else openModal(item,item.media_type);
}

function closeSuggestions(){
  byId("suggList").style.display = "none";
  byId("searchBox").setAttribute("aria-expanded","false");
  suggestionItems = [];
  activeIndex = -1;
}

async function showActorCredits(person){
  lastFetchMode = "actor";
  currentPage = 1;
  totalPages = 1;
  ++collectionSequence;
  setActiveTab("");
  showBrowseFilters(false);
  byId("sectionTitle").textContent = `Movies & TV Shows featuring ${person.name}`;
  setStatus("Loading acting credits…");
  try{
    const data = await apiFetch(`/person/${person.id}/combined_credits`, { language:"en-US" });
    const unique = new Map();
    for(const item of data.cast || []){
      if(!["movie","tv"].includes(item.media_type)) continue;
      if(!isReleased(item,item.media_type)) continue;
      const key = itemKey(item,item.media_type);
      const existing = unique.get(key);
      if(!existing || Number(item.popularity || 0) > Number(existing.popularity || 0)){
        unique.set(key,item);
      }
    }
    const items = [...unique.values()]
      .sort((a,b)=>Number(b.popularity || 0)-Number(a.popularity || 0));
    renderRow(items,"multi");
    setStatus(items.length ? "" : "No released acting credits were found.");

    setStatus("Could not load this actor’s credits.");

async function loadSeasons(tvId,preferred){
  tvControls.style.display = "flex";
  seasonSelect.disabled = true;
  episodeSelect.disabled = true;
  seasonSelect.innerHTML = `<option value="">Loading…</option>`;
  episodeSelect.innerHTML = `<option value="">Select a season first</option>`;
  try{
    const meta = await apiFetch(`/tv/${tvId}`, { language:"en-US" });
    const seasons = (meta.seasons || []).filter(season=>season.season_number > 0);
    seasonSelect.innerHTML = "";
    for(const season of seasons){
      const option = document.createElement("option");
      option.value = String(season.season_number);
      option.textContent = `S${String(season.season_number).padStart(2,"0")} — ${season.episode_count} eps`;
      seasonSelect.appendChild(option);
    }
    if(!seasons.length){
      seasonSelect.innerHTML = `<option value="">No seasons found</option>`;
      return false;
    }
    const preferredSeason = seasons.some(season=>season.season_number === Number(preferred?.season))
      ? Number(preferred.season)
      : seasons[0].season_number;
    seasonSelect.value = String(preferredSeason);
    seasonSelect.disabled = false;
    await loadEpisodes(tvId,preferredSeason,preferred?.season === preferredSeason ? preferred.episode : null);
    return true;
  }catch(error){
    console.error(error);
    seasonSelect.innerHTML = `<option value="">Could not load seasons</option>`;
    return false;
  }
}

async function loadEpisodes(tvId,seasonNumber,preferredEpisode=null){
  episodeSelect.disabled = true;
  episodeSelect.innerHTML = `<option value="">Loading…</option>`;
  try{
    const data = await apiFetch(`/tv/${tvId}/season/${seasonNumber}`, { language:"en-US" });
    const episodes = data.episodes || [];
    episodeSelect.innerHTML = "";
    for(const episode of episodes){
      const option = document.createElement("option");
      option.value = String(episode.episode_number);
      option.textContent = `E${String(episode.episode_number).padStart(2,"0")} — ${episode.name || `Episode ${episode.episode_number}`}`;
      episodeSelect.appendChild(option);
    }
    if(!episodes.length){
      episodeSelect.innerHTML = `<option value="">No episodes found</option>`;
      return false;
    }
    const selected = episodes.some(episode=>episode.episode_number === Number(preferredEpisode))
      ? Number(preferredEpisode)
      : episodes[0].episode_number;
    episodeSelect.value = String(selected);
    episodeSelect.disabled = false;
    return true;
  }catch(error){
    console.error(error);
    episodeSelect.innerHTML = `<option value="">Could not load episodes</option>`;
    return false;
  }
}

function updatePlaySelection(item){
  const playButton = byId("playBtn");
  const season = Number(seasonSelect.value || 1);
  const episode = Number(episodeSelect.value || 1);
  playButton.dataset.s = String(season);
  playButton.dataset.e = String(episode);
  const progress = savedProgress(item.id);
  const isContinue = progress &&
    Number(progress.season) === season &&
    Number(progress.episode) === episode;
  playButton.textContent = isContinue
    ? `▶ Continue S${String(season).padStart(2,"0")} E${String(episode).padStart(2,"0")}`
    : `▶ Play S${String(season).padStart(2,"0")} E${String(episode).padStart(2,"0")}`;
}

async function openModal(item,type){
  if(type === "person"){
    showActorCredits(item);
    return;
  }
  const modalType = mediaTypeFor(item,type);
  const sequence = ++modalSequence;
  modalContext = { item, type:modalType };
  lastFocusedElement = document.activeElement;
  addRecent(item,modalType);

  const modal = byId("modal");
  modal.classList.add("open");
  document.body.classList.add("modal-open");
  byId("mPoster").src = item.poster_path ? IMG + item.poster_path : PLACEHOLDER_POSTER;
  byId("mPoster").alt = `${mediaTitle(item)} poster`;
  byId("mTitle").textContent = mediaTitle(item);
  byId("mMeta").textContent =
    `${modalType.toUpperCase()} • ${mediaDate(item,modalType) || "Unknown"} • ⭐ ${Number(item.vote_average || 0).toFixed(1)}`;
  byId("mOverview").textContent = item.overview || "No description available.";
  updateMyListButton();

  const trailerWrap = byId("trailerWrap");
  trailerWrap.style.display = "none";
  trailerWrap.innerHTML = "";
  fetchTrailerKey(item.id,modalType).then(key=>{
    if(sequence === modalSequence && byId("modal").classList.contains("open")) showTrailerThumb(key);
  });

  const playButton = byId("playBtn");
  playButton.disabled = false;
  if(modalType === "tv"){
    tvControls.style.display = "flex";
    playButton.disabled = true;
    const progress = savedProgress(item.id);
    const loaded = await loadSeasons(item.id,progress);
    if(sequence !== modalSequence) return;
    playButton.disabled = !loaded;
    updatePlaySelection(item);
    seasonSelect.onchange = async ()=>{
      playButton.disabled = true;
      await loadEpisodes(item.id,seasonSelect.value);
      updatePlaySelection(item);
      playButton.disabled = false;
    };
    episodeSelect.onchange = ()=>updatePlaySelection(item);
    playButton.onclick = event=>{
      event.preventDefault();
      const season = Number(playButton.dataset.s || 1);
      const episode = Number(playButton.dataset.e || 1);
      closeModal();
      openPlayer(item,season,episode);
    };
  }else{
    tvControls.style.display = "none";
    playButton.textContent = "▶ Play";
    playButton.onclick = ()=>{
      window.location.href = `https://vsembed.ru/embed/movie/${item.id}`;
    };
  }
  requestAnimationFrame(()=>byId("modal").querySelector(".sheet").focus());
}

function closeModal(){
  ++modalSequence;
  byId("modal").classList.remove("open");
  document.body.classList.remove("modal-open");
  const trailerWrap = byId("trailerWrap");
  trailerWrap.innerHTML = "";
  trailerWrap.style.display = "none";
  modalContext = null;
  if(lastFocusedElement?.focus) lastFocusedElement.focus();
}

function wireModalAndKeyboard(){
  byId("modal").addEventListener("click",event=>{
    if(event.target === byId("modal")) closeModal();
  });
  document.addEventListener("keydown",event=>{
    if(event.key !== "Escape") return;
    if(playerEl.wrap.classList.contains("open")) closePlayer();
    else if(byId("modal").classList.contains("open")) closeModal();
    else closeSuggestions();
  });
}

/*** MANUAL TV PLAYER — PREVIOUS, NEXT, EXIT ***/
const playerEl = {
  wrap:byId("playerOverlay"),
  frame:byId("playerFrame"),
  title:byId("playerTitle"),
  badge:byId("playerBadge"),
  prev:byId("prevEpBtn"),
  next:byId("nextEpBtn"),
  exit:byId("closePlayerBtn")
};
let curTV = { id:null,season:1,episode:1,episodeCountBySeason:new Map(),title:"",item:null };
let controlsHideTimer = null;

function vidsrcTv(tvId,season,episode){
  return `https://vsembed.ru/embed/tv/${tvId}?season=${season}&episode=${episode}`;
}

async function getSeasonEpisodeCount(tvId,seasonNumber){
  if(curTV.episodeCountBySeason.has(seasonNumber)){
    return curTV.episodeCountBySeason.get(seasonNumber);
  }
  const data = await apiFetch(`/tv/${tvId}/season/${seasonNumber}`, { language:"en-US" });
  const count = (data.episodes || []).length;
  curTV.episodeCountBySeason.set(seasonNumber,count);
  return count;
}

async function getSeasonNumbers(tvId){
  const data = await apiFetch(`/tv/${tvId}`, { language:"en-US" });
  return (data.seasons || [])
    .filter(season=>season.season_number > 0)
    .map(season=>season.season_number)
    .sort((a,b)=>a-b);
}

async function getNextPair(tvId,season,episode){
  const count = await getSeasonEpisodeCount(tvId,season);
  if(episode < count) return { s:season,e:episode+1 };
  const seasons = await getSeasonNumbers(tvId);
  const index = seasons.indexOf(Number(season));
  return index >= 0 && index < seasons.length - 1
    ? { s:seasons[index+1],e:1 }
    : null;
}

async function getPrevPair(tvId,season,episode){
  if(episode > 1) return { s:season,e:episode-1 };
  const seasons = await getSeasonNumbers(tvId);
  const index = seasons.indexOf(Number(season));
  if(index <= 0) return null;
  const previousSeason = seasons[index-1];
  const count = await getSeasonEpisodeCount(tvId,previousSeason);
  return { s:previousSeason,e:count || 1 };
}

function loadEpisode(tvId,season,episode){
  curTV.id = tvId;
  curTV.season = Number(season);
  curTV.episode = Number(episode);
  playerEl.frame.src = vidsrcTv(tvId,season,episode);
  playerEl.badge.textContent =
    `S${String(season).padStart(2,"0")} • E${String(episode).padStart(2,"0")}`;
  if(curTV.item) saveProgress(curTV.item,season,episode);
}

async function playNext(){
  playerEl.next.disabled = true;
  try{
    const pair = await getNextPair(curTV.id,curTV.season,curTV.episode);
    if(!pair){
      playerEl.badge.textContent += " • End of series";
      return;
    }
    loadEpisode(curTV.id,pair.s,pair.e);
  }catch(error){
    console.error(error);
  }finally{
    playerEl.next.disabled = false;
  }
}

async function playPrev(){
  playerEl.prev.disabled = true;
  try{
    const pair = await getPrevPair(curTV.id,curTV.season,curTV.episode);
    if(pair) loadEpisode(curTV.id,pair.s,pair.e);
  }catch(error){
    console.error(error);
  }finally{
    playerEl.prev.disabled = false;
  }
}

function showControls(){
  playerEl.wrap.classList.add("controls-visible");
  clearTimeout(controlsHideTimer);
  controlsHideTimer = setTimeout(()=>{
    playerEl.wrap.classList.remove("controls-visible");
  },3500);
}

function openPlayer(item,season,episode){
  curTV = {
    id:item.id,
    season:Number(season),
    episode:Number(episode),
    episodeCountBySeason:new Map(),
    title:mediaTitle(item),
    item
  };
  playerEl.title.textContent = mediaTitle(item);
  playerEl.wrap.classList.add("open");
  document.body.classList.add("modal-open");
  ["mousemove","click","touchstart","keydown"].forEach(eventName=>
    playerEl.wrap.addEventListener(eventName,showControls)
  );
  showControls();
  loadEpisode(item.id,season,episode);
  const fullscreenTarget = playerEl.wrap;
  if(fullscreenTarget.requestFullscreen) fullscreenTarget.requestFullscreen().catch(()=>{});
  else if(fullscreenTarget.webkitRequestFullscreen) fullscreenTarget.webkitRequestFullscreen();
}

function closePlayer(){
  playerEl.wrap.classList.remove("open","controls-visible");
  document.body.classList.remove("modal-open");
  ["mousemove","click","touchstart","keydown"].forEach(eventName=>
    playerEl.wrap.removeEventListener(eventName,showControls)
  );
  clearTimeout(controlsHideTimer);
  playerEl.frame.src = "about:blank";
  if(document.fullscreenElement && document.exitFullscreen){
    document.exitFullscreen().catch(()=>{});
  }else if(document.webkitFullscreenElement && document.webkitExitFullscreen){
    document.webkitExitFullscreen();
  }
}

playerEl.exit.addEventListener("click",closePlayer);
playerEl.next.addEventListener("click",playNext);
playerEl.prev.addEventListener("click",playPrev);
</script>
<script>
(function(){
  // 1) Make page just barely scrollable so Silk allows a real scroll
  const prevMin = document.body.style.minHeight;
  document.body.style.minHeight = '101vh';

  function triggerOnce() {
    // Do a tiny real scroll to make Silk hide its bars
    window.scrollBy(0, 2);
    setTimeout(() => { window.scrollBy(0, -2); }, 0);

    // Cleanup: restore min-height and remove listeners
    document.body.style.minHeight = prevMin;
    ['pointermove','touchstart','click','wheel','keydown'].forEach(evt =>
      window.removeEventListener(evt, triggerOnce, {passive:true})
    );
  }

  // 2) Try once shortly after load (some builds honor this)
  window.addEventListener('load', () => setTimeout(triggerOnce, 500), {once:true});

  // 3) Guarantee it on first user interaction (remote/mouse/tap/scroll/key)
  ['pointermove','touchstart','click','wheel','keydown'].forEach(evt =>
    window.addEventListener(evt, triggerOnce, {passive:true, once:true})
  );
})();
</script>
